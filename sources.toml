tools.minijson-despacer = "https://github.com/aminya/despacer#6e501899eeb7686b1b04de40f02f9792a4e3e8b9"
# claude-plugins-official has no tags, always-updated marketplace repo -- HEAD pin
claude.plugins.claude-plugins-official = "https://github.com/anthropics/claude-plugins-official"
# tags here are junk (latest semver-sorted tag predates the Caveman 2 rewrite) -- HEAD pin
claude.plugins.caveman = "https://github.com/JuliusBrussee/caveman"
# No tags upstream (pre-alpha) -- HEAD pin, same as claude.plugins.caveman.
tools.maxima = "https://github.com/ArmchairDevelopers/Maxima"
mpv.webtorrent-mpv-hook = "https://github.com/mrxdst/webtorrent-mpv-hook"

[cargo]
tools.maxima = "true"
tools.mcp-compressor = "true"


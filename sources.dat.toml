[url]
# No-Intro's own DAT-o-MATIC (datomatic.no-intro.org) has no direct
# per-system download -- its /profile.xml only lists metadata, with `<url>`
# and `<file>` both literally "_" placeholders (verified directly); real
# downloads require its dynamic web UI, not a stable script-fetchable URL.
# libretro/libretro-database's metadat/no-intro/ re-publishes the same
# No-Intro data with real crc/md5/sha1 fields (verified against its NES
# dat: 14132 hash entries, "version 2026.08.01", sourced from
# github.com/robloach/libretro-dats) -- fetched here as plain per-system
# files (~31MB total across all 92) rather than cloning the whole ~800MB
# libretro-database monorepo just for this one subdirectory.
#
# Format note: these are ClrMamePro text dats (`game ( name "..." rom (
# ... crc X md5 X sha1 X ) )`), NOT the Logiqx XML redump.* above uses --
# lib/fetchers/py/dat-to-json.py only parses Logiqx XML today, so these
# aren't wired into lib/fetchers/disc.nix yet. Registered as sources for
# a future cartridge-dump fetcher, not consumed anywhere yet.
#
# Wii U: the only redump.org Wii U angle came up empty (see the [zip]
# comment above), but No-Intro does carry "Nintendo - Wii U (Digital)" --
# digital/eShop titles specifically, not physical disc dumps, so it
# doesn't fill the gap this was originally asked about, just noting it
# exists.
noIntro.arduboy-inc-arduboy = "https://raw.githubusercontent.com/libretro/libretro-database/master/metadat/no-intro/Arduboy%20Inc%20-%20Arduboy.dat"

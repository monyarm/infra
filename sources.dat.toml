# redump.org DAT files -- disc hash databases for lib/fetchers/disc.nix's
# ripDisc/ripDiscContents/ripDiscRedumper. Every system code below was
# scraped from redump.org's own /discs/ listing and individually verified
# to return a real zip (not redump's "System doesn't exist" error page)
# before being added here. PS4 and Wii U were requested too, but redump
# doesn't have either: confirmed by hitting datfile/ps4/ and datfile/wiiu/
# directly (same "doesn't exist" error), and the only public Wii U .dat
# found elsewhere (libretro-database, GameTDB-derived) carries no hash
# fields at all -- a metadata catalog, not a verification database, so
# not usable here regardless. iktv/kt/ns12/stv have a redump /system/ page
# but no public datfile either, same as Wii U -- skipped for the same reason.
